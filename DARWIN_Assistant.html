<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d1118">
  
  <title>DARWIN Assistant</title>
  <style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;
  background:radial-gradient(circle at top,#26364c 0%,#111722 45%,#080b10 100%);
  color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
.page{width:min(600px,92vw);margin:auto;padding:80px 0 120px;text-align:center}
.hero-orb{
  width:90px;height:90px;margin:auto;border-radius:26px;display:grid;place-items:center;
  font-size:40px;color:#062c28;
  background:radial-gradient(circle at 30% 25%,#d5fff7,#83e8d2 45%,#3a9e8c);
  box-shadow:0 0 30px rgba(115,235,210,.35);
}
.page h1{font-size:36px;margin:18px 0 8px}
.page p{color:#aab6c9;line-height:1.6}
.siri-bar{
  position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
  width:min(94vw,430px);height:64px;display:flex;align-items:center;gap:12px;
  padding:8px 10px 8px 14px;border-radius:22px;
  background:rgba(22,29,42,.92);border:1px solid rgba(255,255,255,.12);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:0 12px 45px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.06);
  z-index:999999;
}
.siri-orb{
  width:43px;height:43px;flex-shrink:0;border-radius:15px;display:grid;place-items:center;
  color:#062c28;font-size:22px;
  background:radial-gradient(circle at 30% 25%,#d5fff7,#83e8d2 45%,#3a9e8c);
  box-shadow:0 0 20px rgba(115,235,210,.35);transition:.2s;
}
.siri-bar.listening .siri-orb{animation:siriPulse 1s infinite alternate}
@keyframes siriPulse{
  from{transform:scale(1);box-shadow:0 0 15px rgba(115,235,210,.35)}
  to{transform:scale(1.08);box-shadow:0 0 35px rgba(115,235,210,.8)}
}
.siri-text{flex:1;min-width:0}
.siri-name{font-size:14px;font-weight:700;margin-bottom:2px}
.siri-status{font-size:12px;color:#aab6c9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mic-button{
  width:46px;height:46px;border:none;border-radius:16px;display:grid;place-items:center;
  background:#8ce8d0;color:#082c27;font-size:20px;cursor:pointer;
  transition:transform .15s,background .15s;
}
.mic-button:active{transform:scale(.92)}
.siri-bar.listening .mic-button{background:#ff7b8a;color:#fff}
.language-button{
  position:fixed;right:14px;top:14px;border:1px solid rgba(255,255,255,.12);
  border-radius:14px;padding:9px 12px;background:rgba(25,32,45,.85);color:#fff;
  backdrop-filter:blur(15px);cursor:pointer;z-index:999998;
}

</style>

<meta name="application-name" content="DARWIN Assistant">
<meta name="description" content="DARWIN Hindi and English voice assistant">
</head>
<body>
  <button class="language-button" id="languageButton">EN</button>

  <main class="page">
    <div class="hero-orb">✦</div>
    <h1>DARWIN</h1>
    <p>Your personal offline-first assistant.<br>आपकी व्यक्तिगत सहायक।</p>
  </main>

  <div class="siri-bar" id="siriBar">
    <div class="siri-orb">✦</div>
    <div class="siri-text">
      <div class="siri-name">DARWIN</div>
      <div class="siri-status" id="siriStatus">Tap the microphone</div>
    </div>
    <button class="mic-button" id="micButton" aria-label="Start listening">🎙️</button>
  </div>

  <script>
const siriBar=document.getElementById("siriBar");
const micButton=document.getElementById("micButton");
const siriStatus=document.getElementById("siriStatus");
const languageButton=document.getElementById("languageButton");

let hindi=false;
let recognition=null;

function setStatus(text){siriStatus.textContent=text}

function speak(text){
  setStatus(text);
  if(!("speechSynthesis" in window))return;
  speechSynthesis.cancel();
  const voice=new SpeechSynthesisUtterance(text);
  voice.lang=hindi?"hi-IN":"en-IN";
  voice.rate=.95;
  voice.pitch=1;
  speechSynthesis.speak(voice);
}

function getSpeechRecognition(){
  return window.SpeechRecognition||window.webkitSpeechRecognition;
}

function startListening(){
  const SpeechRecognitionAPI=getSpeechRecognition();
  if(!SpeechRecognitionAPI){
    speak(hindi?"इस ब्राउज़र में आवाज़ पहचान उपलब्ध नहीं है।":"Speech recognition is not available in this browser.");
    return;
  }

  if(recognition){try{recognition.abort()}catch(_){}}

  recognition=new SpeechRecognitionAPI();
  recognition.lang=hindi?"hi-IN":"en-IN";
  recognition.continuous=false;
  recognition.interimResults=false;
  recognition.maxAlternatives=1;

  recognition.onstart=()=>{
    siriBar.classList.add("listening");
    micButton.textContent="⏹";
    setStatus(hindi?"सुन रही हूँ…":"Listening…");
  };

  recognition.onresult=event=>{
    const result=event.results[0][0].transcript;
    setStatus(result);
    handleCommand(result);
  };

  recognition.onerror=event=>{
    siriBar.classList.remove("listening");
    micButton.textContent="🎙️";
    const message=event.error==="not-allowed"
      ?(hindi?"माइक्रोफ़ोन की अनुमति दें।":"Please allow microphone access.")
      :(hindi?"मैं सुन नहीं पाई। फिर से कोशिश करें।":"I couldn't hear you. Try again.");
    speak(message);
  };

  recognition.onend=()=>{
    siriBar.classList.remove("listening");
    micButton.textContent="🎙️";
  };

  try{recognition.start()}catch(error){console.log(error)}
}

micButton.addEventListener("click",()=>{
  if(recognition&&siriBar.classList.contains("listening")){
    recognition.stop();
    return;
  }
  startListening();
});

languageButton.addEventListener("click",()=>{
  hindi=!hindi;
  languageButton.textContent=hindi?"HI":"EN";
  setStatus(hindi?"हिंदी तैयार":"English ready");
});

function handleCommand(originalCommand){
  let command=originalCommand.toLowerCase().trim();
  command=command.replace(/^hey siri[\s,]*/,"").replace(/^हे सिरी[\s,]*/,"");

  if(command.includes("time")||command.includes("समय")||command.includes("कितने बजे")){
    const time=new Date().toLocaleTimeString(hindi?"hi-IN":"en-IN",{hour:"numeric",minute:"2-digit"});
    speak(hindi?"अभी समय है "+time:"The time is "+time);
    return;
  }

  if(command.includes("youtube")||command.includes("यूट्यूब")){
    speak(hindi?"यूट्यूब खोल रही हूँ।":"Opening YouTube.");
    setTimeout(()=>location.href="https://m.youtube.com/",700);
    return;
  }

  if(command.includes("maps")||command.includes("map")||command.includes("मैप")){
    speak(hindi?"मैप खोल रही हूँ।":"Opening Maps.");
    setTimeout(()=>location.href="https://maps.google.com/",700);
    return;
  }

  if(command.includes("whatsapp")){
    speak(hindi?"व्हाट्सऐप खोल रही हूँ।":"Opening WhatsApp.");
    setTimeout(()=>location.href="https://www.whatsapp.com/",700);
    return;
  }

  if(command.includes("call")||command.includes("कॉल")||command.includes("फोन")){
    speak(hindi?"फोन ऐप खोल रही हूँ।":"Opening the phone app.");
    setTimeout(()=>location.href="tel:",700);
    return;
  }

  if(command.includes("wifi")||command.includes("wi-fi")||command.includes("वाईफाई")){
    speak(hindi?"कृपया क्विक सेटिंग्स से वाई-फाई बदलें।":"Use Quick Settings to change Wi-Fi.");
    return;
  }

  if(command.includes("bluetooth")||command.includes("ब्लूटूथ")){
    speak(hindi?"कृपया क्विक सेटिंग्स से ब्लूटूथ बदलें।":"Use Quick Settings to change Bluetooth.");
    return;
  }

  speak(hindi?"माफ़ कीजिए, मैं अभी यह काम नहीं कर सकती।":"Sorry, I can't do that yet.");
}

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(console.error));
}

</script>
</body>
</html>
